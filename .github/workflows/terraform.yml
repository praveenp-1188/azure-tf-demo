name: terraform

on:
  pull_request:
    branches: [main]
    paths: ["envs/**", "modules/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["envs/**", "modules/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  id-token: write       # required for OIDC login to Azure
  contents: read
  pull-requests: write  # to post the plan as a PR comment

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_IN_AUTOMATION: "true"
  WORKDIR: envs/dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -backend=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: TFLint init (download rulesets)
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: TFLint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  plan:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}"
          -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=dev.terraform.tfstate"

      - name: Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Show plan
        id: show
        run: terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKDIR }}/plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "### Terraform plan (dev)\n```hcl\n" + plan + "\n```"
            });

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKDIR }}/tfplan

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev   # add required reviewers on this environment for a manual approval gate
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKDIR }}

      - name: Init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}"
          -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=dev.terraform.tfstate"

      - name: Apply saved plan
        run: terraform apply -input=false tfplan

      - name: Export outputs
        id: out
        run: |
          echo "app_name=$(terraform output -raw web_app_name)" >> "$GITHUB_OUTPUT"
          echo "app_url=$(terraform output -raw web_app_url)"   >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy sample app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.out.outputs.app_name }}
          package: app

      - name: Smoke test
        run: |
          sleep 30
          curl --fail --retry 5 --retry-delay 10 "${{ steps.out.outputs.app_url }}/health"
